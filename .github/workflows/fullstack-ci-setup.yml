name: CI-Setup

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    # The smoke test boots against a real database. This one is disposable, so
    # nothing in CI can reach — or write to — the shared Atlas cluster.
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      # Throwaway: signs cookies for a server that lives for one job. A real
      # secret never goes in a workflow file.
      JWT_SECRET: ci-not-a-secret
      # Also throwaway. Present so the tests that build the Google redirect run
      # here; nothing in the suite calls Google.
      GOOGLE_CLIENT_ID: ci-not-a-client
      GOOGLE_CLIENT_SECRET: ci-not-a-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/google/callback

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: npm test